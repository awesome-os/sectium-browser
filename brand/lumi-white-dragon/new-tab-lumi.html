<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sectium — Lumi White Dragon</title>
  <style>
    :root { --bg: #07090f; --fg: #eef4ff; --muted: #8fa3c0; --accent: #7ee8fa; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: radial-gradient(circle at 50% 35%, #11192b 0%, var(--bg) 70%); color: var(--fg); font-family: system-ui, -apple-system, Segoe UI, sans-serif; display: grid; place-items: center; overflow: hidden; }
    .canvas { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 2rem; }
    .crest { width: 120px; height: 120px; filter: drop-shadow(0 0 28px rgba(126, 232, 250, 0.35)); }
    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    p { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.04em; }
  </style>
</head>
<body data-sectium-canvas="SECTIUM_NATIVE_CANVAS" data-brand="lumi-white-dragon">
  <main class="canvas">
    <svg class="crest" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Lumi White Dragon">
      <circle cx="64" cy="64" r="56" stroke="#7ee8fa" stroke-opacity="0.35" stroke-width="2" />
      <path d="M64 20 L86 48 L76 58 L94 74 L64 108 L34 74 L52 58 L42 48 Z" fill="#eef4ff" fill-opacity="0.92" />
      <path d="M64 34 L76 52 L64 64 L52 52 Z" fill="#7ee8fa" />
      <circle cx="56" cy="50" r="2.5" fill="#07090f" />
      <circle cx="72" cy="50" r="2.5" fill="#07090f" />
    </svg>
    <h1>Sectium</h1>
    <p>Lumi White Dragon Baseline &middot; Pure-Art Display Appliance</p>
  </main>
</body>
</html>
