name: Chromium Sparse + Parallel Standalone Shards (Free Cloud Builder)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target release tag for standalone compiled Chromium engine shards'
        required: true
        default: 'v0.6.0-chromium-shards'

permissions:
  contents: write
  actions: write

jobs:
  ensure-release:
    name: Ensure Staging Release Exists
    runs-on: ubuntu-latest
    steps:
      - name: Create Release If Missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.6.0-chromium-shards' }}
        run: |
          gh release view "$TAG" --repo awesome-os/sectium-browser >/dev/null 2>&1 || \
            gh release create "$TAG" --repo awesome-os/sectium-browser \
              --title "Chromium Independent Engine Shards (${TAG})" \
              --notes "Independent Chromium C/C++ shared library shards compiled fresh in parallel on free \`ubuntu-latest\` (zero monolithic checkout required for final assembly)."

  shard-boringssl:
    needs: ensure-release
    name: Shard 1 — BoringSSL (libcrypto.so + libssl.so)
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build clang golang-go
      - name: Compile & Publish BoringSSL Shared Shard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.6.0-chromium-shards' }}
        run: |
          git clone --depth=1 https://boringssl.googlesource.com/boringssl /tmp/boringssl
          SHA=$(git -C /tmp/boringssl rev-parse --short HEAD)
          cmake -G Ninja -S /tmp/boringssl -B /tmp/boringssl/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          ninja -C /tmp/boringssl/build crypto ssl
          mkdir -p /tmp/dist
          tar -czf /tmp/dist/boringssl-shared-linux-x64.tar.gz -C /tmp/boringssl/build libcrypto.so libssl.so
          tar -czf "/tmp/dist/boringssl-include-${SHA}.tar.gz" -C /tmp/boringssl include
          cd /tmp/dist && sha256sum *.tar.gz > SHA256SUMS-boringssl-x64.txt
          gh release upload "$TAG" /tmp/dist/* --repo awesome-os/sectium-browser --clobber

  shard-brotli:
    needs: ensure-release
    name: Shard 2 — Brotli (libbrotlidec.so + libbrotlienc.so)
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build clang
      - name: Compile & Publish Brotli Shared Shard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.6.0-chromium-shards' }}
        run: |
          git clone --depth=1 https://github.com/google/brotli.git /tmp/brotli
          SHA=$(git -C /tmp/brotli rev-parse --short HEAD)
          cmake -G Ninja -S /tmp/brotli -B /tmp/brotli/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DBROTLI_DISABLE_TESTS=ON -DCMAKE_C_COMPILER=clang
          ninja -C /tmp/brotli/build brotlicommon brotlidec brotlienc
          mkdir -p /tmp/dist
          (cd /tmp/brotli/build && tar -czf /tmp/dist/brotli-shared-linux-x64.tar.gz libbrotlicommon.so* libbrotlidec.so* libbrotlienc.so*)
          tar -czf "/tmp/dist/brotli-include-${SHA}.tar.gz" -C /tmp/brotli/c include
          cd /tmp/dist && sha256sum *.tar.gz > SHA256SUMS-brotli-x64.txt
          gh release upload "$TAG" /tmp/dist/* --repo awesome-os/sectium-browser --clobber

  shard-webp:
    needs: ensure-release
    name: Shard 3 — libwebp (libwebp.so + libwebpdemux.so + libwebpmux.so)
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build clang
      - name: Compile & Publish libwebp Shared Shard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.6.0-chromium-shards' }}
        run: |
          git clone --depth=1 https://chromium.googlesource.com/webm/libwebp /tmp/libwebp
          SHA=$(git -C /tmp/libwebp rev-parse --short HEAD)
          cmake -G Ninja -S /tmp/libwebp -B /tmp/libwebp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DWEBP_BUILD_ANIM_UTILS=OFF -DWEBP_BUILD_CWEBP=OFF -DWEBP_BUILD_DWEBP=OFF -DWEBP_BUILD_GIF2WEBP=OFF -DWEBP_BUILD_IMG2WEBP=OFF -DWEBP_BUILD_VWEBP=OFF -DWEBP_BUILD_WEBPINFO=OFF -DWEBP_BUILD_WEBPMUX=OFF -DWEBP_BUILD_EXTRAS=OFF -DCMAKE_C_COMPILER=clang
          ninja -C /tmp/libwebp/build webp webpdemux
          mkdir -p /tmp/dist
          (cd /tmp/libwebp/build && tar -czf /tmp/dist/libwebp-shared-linux-x64.tar.gz libwebp*.so* libsharpyuv*.so*)
          tar -czf "/tmp/dist/libwebp-include-${SHA}.tar.gz" -C /tmp/libwebp/src webp
          cd /tmp/dist && sha256sum *.tar.gz > SHA256SUMS-libwebp-x64.txt
          gh release upload "$TAG" /tmp/dist/* --repo awesome-os/sectium-browser --clobber

  shard-zlib-ng:
    needs: ensure-release
    name: Shard 4 — zlib-ng (libz.so SIMD-accelerated)
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build clang
      - name: Compile & Publish zlib-ng Shared Shard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.6.0-chromium-shards' }}
        run: |
          git clone --depth=1 https://github.com/zlib-ng/zlib-ng.git /tmp/zlib-ng
          SHA=$(git -C /tmp/zlib-ng rev-parse --short HEAD)
          cmake -G Ninja -S /tmp/zlib-ng -B /tmp/zlib-ng/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DZLIB_COMPAT=ON -DZLIB_ENABLE_TESTS=OFF -DCMAKE_C_COMPILER=clang
          ninja -C /tmp/zlib-ng/build
          mkdir -p /tmp/dist
          (cd /tmp/zlib-ng/build && tar -czf /tmp/dist/zlib-shared-linux-x64.tar.gz libz.so*)
          tar -czf "/tmp/dist/zlib-include-${SHA}.tar.gz" -C /tmp/zlib-ng/build zlib.h zconf.h
          cd /tmp/dist && sha256sum *.tar.gz > SHA256SUMS-zlib-x64.txt
          gh release upload "$TAG" /tmp/dist/* --repo awesome-os/sectium-browser --clobber

  shard-libpng:
    needs: ensure-release
    name: Shard 5 — libpng (libpng*.so)
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build clang zlib1g-dev
      - name: Compile & Publish libpng Shared Shard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.6.0-chromium-shards' }}
        run: |
          git clone --depth=1 https://github.com/pnggroup/libpng.git /tmp/libpng
          SHA=$(git -C /tmp/libpng rev-parse --short HEAD)
          cmake -G Ninja -S /tmp/libpng -B /tmp/libpng/build -DCMAKE_BUILD_TYPE=Release -DPNG_SHARED=ON -DPNG_STATIC=OFF -DPNG_TESTS=OFF -DCMAKE_C_COMPILER=clang
          ninja -C /tmp/libpng/build png_shared
          mkdir -p /tmp/dist
          (cd /tmp/libpng/build && tar -czf /tmp/dist/libpng-shared-linux-x64.tar.gz libpng*.so*)
          tar -czf "/tmp/dist/libpng-include-${SHA}.tar.gz" -C /tmp/libpng png.h pngconf.h
          cd /tmp/dist && sha256sum *.tar.gz > SHA256SUMS-libpng-x64.txt
          gh release upload "$TAG" /tmp/dist/* --repo awesome-os/sectium-browser --clobber

  shard-sqlite3:
    needs: ensure-release
    name: Shard 6 — SQLite3 (libsqlite3.so)
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang curl unzip
      - name: Compile & Publish SQLite3 Shared Shard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.6.0-chromium-shards' }}
        run: |
          mkdir -p /tmp/sqlite /tmp/dist
          curl -fsSL https://www.sqlite.org/2025/sqlite-amalgamation-3490100.zip -o /tmp/sqlite/sqlite.zip
          unzip -q /tmp/sqlite/sqlite.zip -d /tmp/sqlite
          SRC=$(find /tmp/sqlite -maxdepth 2 -name sqlite3.c | head -n 1)
          DIR=$(dirname "$SRC")
          clang -O3 -fPIC -shared -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_JSON1 -DSQLITE_THREADSAFE=1 "$SRC" -o /tmp/dist/libsqlite3.so -lpthread -ldl -lm
          (cd /tmp/dist && tar -czf sqlite3-shared-linux-x64.tar.gz libsqlite3.so)
          tar -czf /tmp/dist/sqlite3-include-3490100.tar.gz -C "$DIR" sqlite3.h sqlite3ext.h
          cd /tmp/dist && sha256sum sqlite3-*.tar.gz > SHA256SUMS-sqlite3-x64.txt
          gh release upload "$TAG" /tmp/dist/sqlite3-*.tar.gz /tmp/dist/SHA256SUMS-sqlite3-x64.txt --repo awesome-os/sectium-browser --clobber

  shard-freetype:
    needs: ensure-release
    name: Shard 7 — FreeType (libfreetype.so)
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build clang zlib1g-dev
      - name: Compile & Publish FreeType Shared Shard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.6.0-chromium-shards' }}
        run: |
          git clone --depth=1 https://gitlab.freedesktop.org/freetype/freetype.git /tmp/freetype
          SHA=$(git -C /tmp/freetype rev-parse --short HEAD)
          cmake -G Ninja -S /tmp/freetype -B /tmp/freetype/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DFT_DISABLE_HARFBUZZ=ON -DFT_DISABLE_BZIP2=ON -DFT_DISABLE_BROTLI=ON -DFT_DISABLE_PNG=ON -DCMAKE_C_COMPILER=clang
          ninja -C /tmp/freetype/build freetype
          mkdir -p /tmp/dist
          (cd /tmp/freetype/build && tar -czf /tmp/dist/freetype-shared-linux-x64.tar.gz libfreetype.so*)
          tar -czf "/tmp/dist/freetype-include-${SHA}.tar.gz" -C /tmp/freetype include
          cd /tmp/dist && sha256sum *.tar.gz > SHA256SUMS-freetype-x64.txt
          gh release upload "$TAG" /tmp/dist/* --repo awesome-os/sectium-browser --clobber

  shard-harfbuzz:
    needs: ensure-release
    name: Shard 8 — HarfBuzz (libharfbuzz.so)
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build clang
      - name: Compile & Publish HarfBuzz Shared Shard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.6.0-chromium-shards' }}
        run: |
          git clone --depth=1 https://github.com/harfbuzz/harfbuzz.git /tmp/harfbuzz
          SHA=$(git -C /tmp/harfbuzz rev-parse --short HEAD)
          cmake -G Ninja -S /tmp/harfbuzz -B /tmp/harfbuzz/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DHB_BUILD_TESTS=OFF -DHB_BUILD_UTILS=OFF -DHB_BUILD_SUBSET=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          ninja -C /tmp/harfbuzz/build harfbuzz
          mkdir -p /tmp/dist
          (cd /tmp/harfbuzz/build && tar -czf /tmp/dist/harfbuzz-shared-linux-x64.tar.gz libharfbuzz.so*)
          (cd /tmp/harfbuzz/src && tar -czf "/tmp/dist/harfbuzz-include-${SHA}.tar.gz" hb*.h)
          cd /tmp/dist && sha256sum *.tar.gz > SHA256SUMS-harfbuzz-x64.txt
          gh release upload "$TAG" /tmp/dist/* --repo awesome-os/sectium-browser --clobber

  shard-libjpeg-turbo:
    needs: ensure-release
    name: Shard 9 — libjpeg-turbo (libjpeg.so + libturbojpeg.so SIMD)
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build clang nasm
      - name: Compile & Publish libjpeg-turbo Shared Shard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.6.0-chromium-shards' }}
        run: |
          git clone --depth=1 https://github.com/libjpeg-turbo/libjpeg-turbo.git /tmp/libjpeg-turbo
          SHA=$(git -C /tmp/libjpeg-turbo rev-parse --short HEAD)
          cmake -G Ninja -S /tmp/libjpeg-turbo -B /tmp/libjpeg-turbo/build -DCMAKE_BUILD_TYPE=Release -DENABLE_SHARED=ON -DENABLE_STATIC=OFF -DWITH_TURBOJPEG=ON -DCMAKE_C_COMPILER=clang
          ninja -C /tmp/libjpeg-turbo/build jpeg turbojpeg
          mkdir -p /tmp/dist
          (cd /tmp/libjpeg-turbo/build && tar -czf /tmp/dist/libjpeg-turbo-shared-linux-x64.tar.gz libjpeg.so* libturbojpeg.so*)
          (cd /tmp/libjpeg-turbo/src && tar -czf "/tmp/dist/libjpeg-turbo-include-${SHA}.tar.gz" jpeglib.h turbojpeg.h jerror.h jmorecfg.h)
          cd /tmp/dist && sha256sum *.tar.gz > SHA256SUMS-libjpeg-turbo-x64.txt
          gh release upload "$TAG" /tmp/dist/* --repo awesome-os/sectium-browser --clobber

  shard-expat:
    needs: ensure-release
    name: Shard 10 — Expat (libexpat.so)
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build clang
      - name: Compile & Publish Expat Shared Shard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.6.0-chromium-shards' }}
        run: |
          git clone --depth=1 https://github.com/libexpat/libexpat.git /tmp/libexpat
          SHA=$(git -C /tmp/libexpat rev-parse --short HEAD)
          cmake -G Ninja -S /tmp/libexpat/expat -B /tmp/libexpat/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DEXPAT_BUILD_TESTS=OFF -DEXPAT_BUILD_EXAMPLES=OFF -DEXPAT_BUILD_TOOLS=OFF -DCMAKE_C_COMPILER=clang
          ninja -C /tmp/libexpat/build expat
          mkdir -p /tmp/dist
          (cd /tmp/libexpat/build && tar -czf /tmp/dist/expat-shared-linux-x64.tar.gz libexpat.so*)
          (cd /tmp/libexpat/expat/lib && tar -czf "/tmp/dist/expat-include-${SHA}.tar.gz" expat.h expat_external.h)
          cd /tmp/dist && sha256sum *.tar.gz > SHA256SUMS-expat-x64.txt
          gh release upload "$TAG" /tmp/dist/* --repo awesome-os/sectium-browser --clobber

  emit-holo-v11-registry-manifest:
    needs: [shard-boringssl, shard-brotli, shard-webp, shard-zlib-ng, shard-libpng, shard-sqlite3, shard-freetype, shard-harfbuzz, shard-libjpeg-turbo, shard-expat]
    name: Emit Unified Holo v11 Registry Manifest (All 10 Shards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aggregate SHA256SUMS into ghost-shards-manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.6.0-chromium-shards' }}
        run: |
          mkdir -p /tmp/sums
          gh release download "$TAG" --repo awesome-os/sectium-browser --pattern "SHA256SUMS-*.txt" --dir /tmp/sums --clobber
          node -e "
            const fs = require('fs');
            const path = require('path');
            const tag = process.env.TAG;
            const entries = [];
            for (const f of fs.readdirSync('/tmp/sums').sort()) {
              for (const line of fs.readFileSync(path.join('/tmp/sums', f), 'utf8').trim().split('\n')) {
                const [sha256, filename] = line.trim().split(/\s+/);
                if (!sha256 || !filename) continue;
                entries.push({
                  filename,
                  sha256,
                  kind: filename.includes('-include-') ? 'headers' : 'shared-lib',
                  download_url: 'https://github.com/awesome-os/sectium-browser/releases/download/' + tag + '/' + filename
                });
              }
            }
            const manifest = { schema: 'holo-v11-registry', tag, total_artifacts: entries.length, artifacts: entries };
            fs.writeFileSync('/tmp/ghost-shards-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
            console.log('[holo-v11-registry] Emitted manifest with', entries.length, 'verified SHA-256 shard artifacts');
          "
          gh release upload "$TAG" /tmp/ghost-shards-manifest.json --repo awesome-os/sectium-browser --clobber
