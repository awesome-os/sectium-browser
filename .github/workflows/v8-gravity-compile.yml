name: V8 Upstream — Real Damped Gravity Compile-Release-Bounce (Free Cloud Runner)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target release tag for the cloud-compiled V8 component pack'
        required: true
        default: 'v0.6.0-v8-cloud'
      bounce_index:
        description: 'Current Damped Gravity bounce (0 = start)'
        required: true
        default: '0'
      max_bounces:
        description: 'Safety cap on total bounces'
        required: true
        default: '12'
      drop_seconds:
        description: 'Wall-clock compile budget per bounce in seconds (default 420 = 7 min)'
        required: true
        default: '420'

permissions:
  contents: write
  actions: write

jobs:
  v8-gravity-bounce:
    runs-on: ubuntu-latest
    steps:
      - name: Reclaim ~30 GB Free SSD on Free ubuntu-latest
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout sectium-browser
        uses: actions/checkout@v4

      - name: Restore Previous Bounce Build State (actions/cache)
        id: cache-v8
        uses: actions/cache@v4
        with:
          path: |
            /tmp/v8-work/v8/out/Component
          key: v8-gravity-${{ inputs.release_tag }}-drop-${{ inputs.bounce_index }}
          restore-keys: |
            v8-gravity-${{ inputs.release_tag }}-drop-

      - name: Setup depot_tools & Shallow Upstream V8 Source
        run: |
          mkdir -p /tmp/v8-work
          cd /tmp/v8-work
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH="/tmp/v8-work/depot_tools:$PATH"
          if [ ! -d /tmp/v8-work/v8/.git ]; then
            echo "[gravity] Fetching shallow upstream V8 (--no-history)..."
            fetch --no-history v8
          fi
          cd /tmp/v8-work/v8
          V8_SHA=$(git rev-parse --short HEAD)
          echo "V8_SHA=$V8_SHA" >> "$GITHUB_ENV"
          echo "[gravity] Upstream V8 HEAD=$V8_SHA"

      - name: Configure Component Build GN Args (is_component_build = true)
        run: |
          export PATH="/tmp/v8-work/depot_tools:$PATH"
          cd /tmp/v8-work/v8
          mkdir -p out/Component
          cat << 'EOF' > out/Component/args.gn
          is_component_build = true
          is_debug = false
          target_cpu = "x64"
          v8_monolithic = false
          v8_use_external_startup_data = false
          treat_warnings_as_errors = false
          symbol_level = 0
          v8_enable_sandbox = true
          EOF
          gn gen out/Component

      - name: Restore Previous Staging Release .o Checkpoint (Zero-Race Fallback)
        if: inputs.bounce_index != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}-staging
          PREV_IDX: ${{ inputs.bounce_index }}
        run: |
          PREV=$((PREV_IDX - 1))
          mkdir -p /tmp/v8-restore
          if gh release download "$TAG" --pattern "v8-drop-${PREV}-objs.*" --dir /tmp/v8-restore --clobber 2>/dev/null; then
            echo "[gravity] Restoring compiled objects from staging release drop #${PREV}..."
            if [ -f "/tmp/v8-restore/v8-drop-${PREV}-objs.tar.zst" ]; then
              tar --zstd -xf "/tmp/v8-restore/v8-drop-${PREV}-objs.tar.zst" -C /tmp/v8-work/v8/out/Component
            elif [ -f "/tmp/v8-restore/v8-drop-${PREV}-objs.tar.gz" ]; then
              tar -xzf "/tmp/v8-restore/v8-drop-${PREV}-objs.tar.gz" -C /tmp/v8-work/v8/out/Component
            fi
          fi

      - name: Bounded Damped Gravity Compile Drop (timeout ${{ inputs.drop_seconds }}s ninja)
        id: compile
        env:
          DROP_SECONDS: ${{ inputs.drop_seconds || '420' }}
          BOUNCE_INDEX: ${{ inputs.bounce_index || '0' }}
        run: |
          export PATH="/tmp/v8-work/depot_tools:$PATH"
          cd /tmp/v8-work/v8
          set +e
          timeout --signal=INT "${DROP_SECONDS}s" ninja -C out/Component v8_libbase v8_libplatform v8
          RC=$?
          set -e
          OBJ_COUNT=$(find out/Component/obj -name '*.o' 2>/dev/null | wc -l)
          SO_COUNT=$(find out/Component -maxdepth 1 -name 'lib*.so' 2>/dev/null | wc -l)
          echo "[gravity] Drop #${BOUNCE_INDEX} finished with rc=${RC} | compiled_objs=${OBJ_COUNT} | shared_libs=${SO_COUNT}"
          if [ "$RC" -eq 0 ]; then
            echo "grounded=true" >> "$GITHUB_OUTPUT"
          elif [ "$RC" -eq 124 ] || [ "$RC" -eq 130 ]; then
            echo "grounded=false" >> "$GITHUB_OUTPUT"
          else
            echo "[gravity] Compile error rc=$RC"
            exit "$RC"
          fi
          echo "obj_count=$OBJ_COUNT" >> "$GITHUB_OUTPUT"
          echo "so_count=$SO_COUNT" >> "$GITHUB_OUTPUT"

      - name: Checkpoint Compiled Objects to Staging Release (Compile -> Release -> Bounce)
        if: steps.compile.outputs.grounded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}-staging
          BOUNCE_INDEX: ${{ inputs.bounce_index || '0' }}
        run: |
          cd /tmp/v8-work/v8
          mkdir -p /tmp/v8-stage
          tar --zstd -cf "/tmp/v8-stage/v8-drop-${BOUNCE_INDEX}-objs.tar.zst" -C out/Component obj 2>/dev/null || \
            tar -czf "/tmp/v8-stage/v8-drop-${BOUNCE_INDEX}-objs.tar.gz" -C out/Component obj
          ls -lh /tmp/v8-stage/
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "V8 Damped Gravity Staging (${{ inputs.release_tag }})" --notes "In-flight Damped Gravity compiled object checkpoints."
          gh release upload "$TAG" /tmp/v8-stage/* --clobber

      - name: Bounce Next Drop (Self-Dispatch on Free ubuntu-latest)
        if: steps.compile.outputs.grounded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOUNCE_INDEX: ${{ inputs.bounce_index || '0' }}
          MAX_BOUNCES: ${{ inputs.max_bounces || '12' }}
        run: |
          NEXT=$((BOUNCE_INDEX + 1))
          if [ "$NEXT" -ge "$MAX_BOUNCES" ]; then
            echo "[gravity] Reached max_bounces=${MAX_BOUNCES} — stopping safely (progress preserved in cache & staging release)."
            exit 0
          fi
          echo "[gravity] Bouncing to Drop #${NEXT} of ${MAX_BOUNCES} (${{ steps.compile.outputs.obj_count }} .o files done so far)..."
          gh workflow run v8-gravity-compile.yml \
            -f release_tag="${{ inputs.release_tag }}" \
            -f bounce_index="$NEXT" \
            -f max_bounces="${{ inputs.max_bounces }}" \
            -f drop_seconds="${{ inputs.drop_seconds }}"

      - name: Pack & Publish Grounded Upstream V8 Component Release
        if: steps.compile.outputs.grounded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          BOUNCE_INDEX: ${{ inputs.bounce_index || '0' }}
        run: |
          mkdir -p /tmp/v8-dist
          cd /tmp/v8-work/v8/out/Component
          tar -czf /tmp/v8-dist/v8-shared-linux-x64.b8p libv8.so libv8_libbase.so libv8_libplatform.so *.so 2>/dev/null || \
            tar -czf /tmp/v8-dist/v8-shared-linux-x64.b8p lib*.so
          cd /tmp/v8-dist
          sha256sum * > SHA256SUMS.txt
          ls -lh /tmp/v8-dist
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" /tmp/v8-dist/* \
            --title "Upstream V8 ${TAG} (${V8_SHA}) — Cloud-Compiled via Damped Gravity" \
            --notes "Real upstream V8 (\`${V8_SHA}\`) component build (\`is_component_build = true\`) compiled on free \`ubuntu-latest\` across $((BOUNCE_INDEX + 1)) Damped Gravity drops."
