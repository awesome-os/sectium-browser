name: Release — Static Sectium Browser (Cloud / Self-Hosted Runner)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      runner_label:
        description: 'Runner label (self-hosted or larger GitHub runner with >=120GB SSD)'
        required: true
        default: 'self-hosted'

permissions:
  contents: write

jobs:
  verify-and-emit-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Emit Hardened Static GN Args (is_component_build=false, build_with_tflite_lib=false)
        run: |
          mkdir -p dist
          node --test installer/release-profile.test.mts installer/security-hardening.test.mts shell/virtual-frame-shell.test.mts
          node -e "import('./installer/release-profile.mts').then(m => { const fs = require('fs'); fs.writeFileSync('dist/args-win64.gn', m.generateStaticReleaseGnArgs('win-x64')); fs.writeFileSync('dist/args-linux-x64.gn', m.generateStaticReleaseGnArgs('linux-x64')); })"
      - uses: actions/upload-artifact@v4
        with:
          name: sectium-static-gn-profiles
          path: dist/*.gn
