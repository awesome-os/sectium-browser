name: V8 Upstream macOS ARM64 — Fresh Cloud Component Build (libv8.dylib on Free macos-15)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target release tag for the cloud-compiled macOS ARM64 V8 pack'
        required: true
        default: 'v0.7.0-v8-cloud'

permissions:
  contents: write

jobs:
  build-v8-macos-arm64:
    runs-on: macos-15
    steps:
      - name: Check Free Disk Space
        run: df -h /

      - name: Setup depot_tools & Shallow Upstream V8 Source
        run: |
          mkdir -p /tmp/v8-work
          cd /tmp/v8-work
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH="/tmp/v8-work/depot_tools:$PATH"
          fetch --no-history v8
          cd /tmp/v8-work/v8
          V8_SHA=$(git rev-parse --short HEAD)
          echo "V8_SHA=$V8_SHA" >> "$GITHUB_ENV"
          echo "[v8-macos-arm64] Upstream V8 HEAD=$V8_SHA"

      - name: Configure macOS ARM64 Component Build GN Args (libv8.dylib)
        run: |
          export PATH="/tmp/v8-work/depot_tools:$PATH"
          cd /tmp/v8-work/v8
          mkdir -p out/Build
          cat << 'EOF' > out/Build/args.gn
          is_component_build = true
          is_debug = false
          target_cpu = "arm64"
          v8_monolithic = false
          v8_use_external_startup_data = false
          treat_warnings_as_errors = false
          symbol_level = 0
          v8_enable_sandbox = true
          EOF
          gn gen out/Build

      - name: Compile Upstream macOS ARM64 V8 Component Dylibs
        run: |
          export PATH="/tmp/v8-work/depot_tools:$PATH"
          cd /tmp/v8-work/v8
          autoninja -C out/Build v8 v8_libbase v8_libplatform

      - name: Pack & Upload v8-shared-macos-arm64.tar.gz to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'v0.7.0-v8-cloud' }}
        run: |
          mkdir -p /tmp/v8-dist
          (cd /tmp/v8-work/v8/out/Build && tar -czf /tmp/v8-dist/v8-shared-macos-arm64.tar.gz lib*.dylib)
          (cd /tmp/v8-dist && shasum -a 256 v8-shared-macos-arm64.tar.gz > SHA256SUMS-component-macos-arm64.txt)
          ls -lh /tmp/v8-dist/
          gh release view "$TAG" --repo awesome-os/sectium-browser >/dev/null 2>&1 || \
            gh release create "$TAG" --repo awesome-os/sectium-browser \
              --title "V8 Upstream Cloud Component Builds (${TAG}) — Multi-OS" \
              --notes "Freshly cloud-compiled upstream V8 component libraries across Linux x64/ARM64, Win64, and macOS ARM64 on free GitHub runners."
          gh release upload "$TAG" /tmp/v8-dist/* --repo awesome-os/sectium-browser --clobber
