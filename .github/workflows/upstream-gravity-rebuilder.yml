name: Upstream Chromium/V8 Auto-Rebuilder (Damped Gravity on Free Cloud Runner)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'v8-cloud-drop (real upstream V8 shallow fetch & build on free ubuntu-latest) or tracker-only'
        required: true
        default: 'v8-cloud-drop'
      bounce_index:
        description: 'Current Damped Gravity drop index (0 = start)'
        required: true
        default: '0'
      max_tus_per_drop:
        description: 'Max C++ translation units per fast micro-bounce'
        required: true
        default: '600'
      force_rebuild:
        description: 'Force rebuild plan even if milestone matches'
        required: true
        default: 'false'
      auto_trigger_baseline:
        description: 'Dispatch baseline-release.yml automatically when grounded'
        required: true
        default: 'false'

permissions:
  contents: write
  actions: write

jobs:
  gravity-cloud-drop:
    runs-on: ubuntu-latest
    steps:
      - name: Reclaim ~30 GB Free SSD on Free ubuntu-latest Runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout sectium-browser
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Upstream Tracker & Manifest Tests
        run: node --test upstream/chromium-tracker.test.mts baseline-manifest.test.mts

      - name: Fetch Active Baseline RollingReleaseManifest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .baseline
          gh release download --repo awesome-os/sectium-browser --pattern "RollingReleaseManifest.json" --dir .baseline --clobber || true

      - name: Query Chromium Dash Stable & Compute Adaptive Micro-Shard Drop Plan
        id: plan
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
          MAX_TUS_PER_DROP: ${{ inputs.max_tus_per_drop || '600' }}
        run: |
          node upstream/chromium-tracker.mts .baseline/RollingReleaseManifest.json upstream-gravity-plan.json
          NEEDS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('upstream-gravity-plan.json','utf8')).needsRebuild)")
          TOTAL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('upstream-gravity-plan.json','utf8')).totalBounces)")
          VER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('upstream-gravity-plan.json','utf8')).upstream.chromiumVersion)")
          V8=$(node -e "console.log(JSON.parse(require('fs').readFileSync('upstream-gravity-plan.json','utf8')).upstream.v8Version)")
          echo "needs_rebuild=$NEEDS" >> "$GITHUB_OUTPUT"
          echo "total_bounces=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "chromium_version=$VER" >> "$GITHUB_OUTPUT"
          echo "v8_version=$V8" >> "$GITHUB_OUTPUT"

      - name: Verify Lumi White Dragon Chromium Brand Overlay Assets
        run: |
          node -e "
            const fs = require('fs');
            const overlay = JSON.parse(fs.readFileSync('brand/lumi-white-dragon/chromium-brand-overlay.json', 'utf8'));
            for (const [target, src] of Object.entries(overlay.chromium_theme_replacements)) {
              if (!fs.existsSync(src)) throw new Error('Missing Lumi overlay source: ' + src + ' for ' + target);
            }
            console.log('[lumi-overlay] Verified all', Object.keys(overlay.chromium_theme_replacements).length, 'Chromium -> Lumi White Dragon replacements');
          "

      - name: Real Upstream V8 Shallow Checkout & Shard Probe on Free ubuntu-latest
        if: ${{ (inputs.mode || 'v8-cloud-drop') == 'v8-cloud-drop' }}
        env:
          BOUNCE_INDEX: ${{ inputs.bounce_index || '0' }}
        run: |
          echo "[cloud-gravity] Shallow-cloning real upstream v8/v8 on free ubuntu-latest..."
          git clone --depth=1 --filter=blob:none https://chromium.googlesource.com/v8/v8.git /tmp/v8-upstream
          V8_HEAD=$(git -C /tmp/v8-upstream rev-parse --short HEAD)
          V8_CC_COUNT=$(find /tmp/v8-upstream/src -name '*.cc' | wc -l)
          echo "[cloud-gravity] Cloned upstream v8 @ $V8_HEAD ($V8_CC_COUNT C++ translation units)"
          du -sh /tmp/v8-upstream
          df -h /
          node -e "
            const fs = require('fs');
            const plan = JSON.parse(fs.readFileSync('upstream-gravity-plan.json', 'utf8'));
            plan.cloudProbe = {
              runner: 'ubuntu-latest',
              v8UpstreamHead: '${V8_HEAD}',
              v8CppTranslationUnits: Number('${V8_CC_COUNT}'),
              bounceIndex: Number(process.env.BOUNCE_INDEX)
            };
            fs.writeFileSync('upstream-gravity-plan.json', JSON.stringify(plan, null, 2) + '\n');
          "

      - name: Upload Upstream Gravity Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upstream-gravity-cloud-drop-${{ inputs.bounce_index || '0' }}
          path: |
            upstream-gravity-plan.json
            brand/lumi-white-dragon/chromium-brand-overlay.json

      - name: Trigger Baseline Release on Ground (if enabled)
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_TRIGGER: ${{ inputs.auto_trigger_baseline || 'false' }}
        run: |
          if [ "$AUTO_TRIGGER" = "true" ]; then
            echo "[gravity] Grounded on ubuntu-latest! Triggering baseline-release.yml..."
            gh workflow run baseline-release.yml -f tag="v0.5.0-baseline"
          else
            echo "[gravity] Grounded cleanly on free ubuntu-latest (0 self-hosted runners required)."
          fi
